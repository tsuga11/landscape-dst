  <body>
    <div class="shell">
      <div id="topbar"></div>
      <header class="masthead">
        <h1>Zonal summary</h1>
        <p>
          Summarize one or more co-registered rasters by planning units — watersheds
          fetched for your extent, polygons you supply, or H3 hexagons derived from
          the raster itself. Outputs a GeoJSON
          you can open in QGIS, and a bundle the prioritization tool reads directly.
        </p>
      </header>

      <div id="messages" class="messages"></div>

      <div class="layout">
        <aside>
          <section id="load-panel" class="panel"></section>
          <section id="zones-panel" class="panel"></section>
          <section id="bands-panel" class="panel"></section>
          <section id="options-panel" class="panel"></section>
          <section id="export-panel" class="panel"></section>
        </aside>
        <main>
          <section id="summary-panel" class="panel"></section>
          <section id="map-panel" class="panel" style="padding: 0; overflow: hidden">
            <div id="map" style="height: 460px"></div>
          </section>
          <section id="table-panel"></section>
        </main>
      </div>
    </div>
