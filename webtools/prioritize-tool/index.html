<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Landscape Prioritization — Ecosystem Resilience Collaborative</title>
    <meta
      name="description"
      content="Rank and select management units from standardized criteria, weighted by swing weights or importance levels, within a budget and spatial rules."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="./assets/index-D2bUyfTY.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/maplibre-DrOnZnMV.js">
    <link rel="stylesheet" crossorigin href="./assets/index-DQsouVpB.css">
  </head>
  <body>
    <div class="shell">
      <div id="topbar"></div>
      <header class="masthead">
        <h1>Landscape prioritization</h1>
        <p>
          Rank management units from standardized criteria, weight them against each
          other, and select as many as a treatment budget will cover. Criteria should
          arrive already on a common scale — use the fuzzy membership tool first.
        </p>
      </header>

      <div id="messages" class="messages"></div>

      <div class="layout">
        <!-- q137-prioritizer-steps-2026-11-11: one step's panels at a time (ui/steps.ts). -->
        <aside id="setup">
          <section id="load-panel" class="panel" data-step="units"></section>
          <!-- q152-criteria-picker-2026-11-11: one choice per column; the band table below keeps the details. -->
          <section id="criteria-panel" class="panel" data-step="objectives"></section>
          <section id="bands-panel" class="panel" data-step="objectives"></section>
          <section id="importance-panel" class="panel" data-step="importance"></section>
          <section id="smarts-panel" class="panel" data-step="importance"></section>
          <section id="budget-panel" class="panel" data-step="budget"></section>
          <!-- q139-prioritizer-rules-2026-11-11: must include / exclude, keep together, minimum group size. -->
          <section id="rules-panel" class="panel" data-step="budget"></section>
          <section id="export-panel" class="panel" data-step="save"></section>
        </aside>
        <main>
          <section id="map-panel" class="panel" style="padding:0;overflow:hidden">
            <div id="map" style="height:480px"></div>
          </section>
          <!-- q138-prioritizer-plans-2026-11-11: alternative plans side by side. -->
          <section id="plans-panel" class="panel"></section>
          <details class="more">
            <summary>Explore all weightings</summary>
            <section id="sweep-panel" class="panel"></section>
          </details>
          <section id="table-panel"></section>
        </main>
      </div>
    </div>

  </body>
</html>
