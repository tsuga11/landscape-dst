<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Loading…</title>

  <!-- ── MapLibre GL JS ───────────────────────────────────── -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">

  <!-- ── App styles ───────────────────────────────────────── -->
  <link rel="stylesheet" href="/shared/style.css">

  <style>
    /* ═══════════════════════════════════════════════════════
       FLOATING MAP FURNITURE
       Anything fixed to the right edge gets .map-floating so it
       slides clear when the DST sidebar opens, rather than being
       overlapped by it. Distance and easing are taken from the
       same --sidebar-width / 0.3s the panel itself uses.
       ═══════════════════════════════════════════════════════ */
    .map-floating {
      transition: transform 0.3s ease;
    }

    body.dst-open .map-floating {
      transform: translateX(calc(-1 * var(--sidebar-width)));
    }

    /* ── Layer panel ────────────────────────────────────────── */
    #layer-panel {
      position: fixed;
      top: calc(var(--navbar-h) + 9rem);
      right: 0.65rem;
      z-index: 450;              /* below #dst-panel (500) */
      font-size: 0.8rem;
    }

    #layer-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      margin-left: auto;
      background: rgba(255,255,255,0.97);
      color: var(--green-deep);
      border: none;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    #layer-toggle-btn svg { display: block; }
    #layer-toggle-btn:hover { background: #fff; }

    #layer-toggle-btn[aria-expanded="true"] {
      background: var(--green-deep);
      color: #fff;
    }

    #layer-panel-inner {
      display: none;
      margin-top: 4px;
      background: rgba(255,255,255,0.97);
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      padding: 0.6rem 0;
      min-width: 180px;
      max-width: 220px;
    }

    #layer-panel-inner.open { display: block; }

    .lp-section { padding: 0.4rem 0.8rem 0.5rem; }
    .lp-section + .lp-section { border-top: 1px solid #eee; }
    .lp-title { font-size: 0.65rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #888; margin-bottom: 0.4rem; }
    .lp-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.2rem 0; cursor: pointer; color: #333; }
    .lp-row:hover { color: #000; }
    .lp-check { cursor: pointer; accent-color: #2a5240; }
    .lp-select { width: 100%; font-size: 0.78rem; padding: 0.2rem 0.3rem; border: 1px solid #ddd; border-radius: 3px; background: #fff; }

    /* ── Legend container ──────────────────────────────────── */
    #legend-container {
      position: fixed;
      bottom: 2.5rem;
      left: 0.75rem;
      z-index: 450;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    /* ── Pitch hint ────────────────────────────────────────── */
    #pitch-hint {
      position: fixed;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.55);
      color: rgba(255,255,255,0.8);
      font-size: 0.7rem;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      pointer-events: none;
      letter-spacing: 0.06em;
      z-index: 500;
      opacity: 1;
      transition: opacity 1s ease;
    }

    #pitch-hint.hidden { opacity: 0; }

    /* ── Small screens: the sidebar is full width, so sliding
          would push the control off-screen entirely ────────── */
    @media (max-width: 600px) {
      body.dst-open .map-floating { transform: none; }
      body.dst-open #layer-panel  { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .map-floating { transition: none; }
    }
  </style>
</head>
<body>

  <!-- ── NAVBAR ───────────────────────────────────────────── -->
  <nav id="navbar">
    <a id="app-title" href="#">Loading…</a>
    <div class="navbar-right">
      <button id="dst-toggle" class="navbar-btn btn-gold" aria-expanded="false">Decision Tool</button>
      <a id="back-link" href="/" class="navbar-btn btn-outline">← Geographies</a>
    </div>
  </nav>

  <!-- ── MAP ──────────────────────────────────────────────── -->
  <div id="map"></div>

  <!-- ── LAYER PANEL ──────────────────────────────────────── -->
  <div id="layer-panel" class="map-floating">
    <button id="layer-toggle-btn" title="Map layers"
            aria-label="Map layers" aria-expanded="false" aria-controls="layer-panel-inner">
      <!-- stacked sheets — the standard "map layers" glyph -->
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
           stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2 2 7l10 5 10-5-10-5Z"/>
        <path d="m2 17 10 5 10-5"/>
        <path d="m2 12 10 5 10-5"/>
      </svg>
    </button>
    <div id="layer-panel-inner">
      <!-- populated by app.js buildLayerPanel() -->
    </div>
  </div>

  <!-- ── LEGEND ───────────────────────────────────────────── -->
  <div id="legend-container">
    <!-- populated by app.js showLegend() -->
  </div>

  <!-- ── PITCH HINT ───────────────────────────────────────── -->
  <div id="pitch-hint">Right-click drag to tilt · Two-finger rotate</div>

  <!-- ── DST PANEL ────────────────────────────────────────── -->
  <div id="dst-panel">
    <!-- populated by app.js buildDSTPanel() -->
  </div>

  <!-- ── HOVER INFO ───────────────────────────────────────── -->
  <div id="info-box"></div>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SCRIPTS                                                 -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- D3 v7 — weight chart -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>

  <!-- Geography config — the ONLY file that differs per geography -->
  <script src="config.js"></script>

  <!-- Generic app logic — never edit -->
  <script src="/shared/app.js"></script>

  <script>
    // Hide the pitch hint after 5 seconds
    setTimeout(() => {
      document.getElementById('pitch-hint')?.classList.add('hidden');
    }, 5000);

    // Layer panel open/close
    (() => {
      const btn   = document.getElementById('layer-toggle-btn');
      const inner = document.getElementById('layer-panel-inner');
      btn?.addEventListener('click', () => {
        const open = inner.classList.toggle('open');
        btn.setAttribute('aria-expanded', open);
      });
    })();
  </script>

</body>
</html>
